function buildExamInsights(rows){
  let h='';
  const usg=rows.find(r=>r.c==='ULTRASSONOGRAFIA');
  if(usg){
    const cls=parseFloat(usg.vjf)>0?'ins-s':'ins-w';
    h+=`<div class="ins ${cls}"><span class="ic">${parseFloat(usg.vjf)>0?'✅':'⚠️'}</span><div><strong>Ultrassonografia:</strong> Jan ${usg.vjf>0?'+':''}${usg.vjf}% fat (R$ ${fm(usg.j5f)}→R$ ${fm(usg.j6f)}). Fev ${usg.vff>0?'+':''}${usg.vff}% (efeito Carnaval). Carro-chefe, ${fi(usg.j6q)} exames/mês.</div></div>`;
  }
  const prev=rows.find(r=>r.c==='PREVENTIVO/PAPANICOLAU');
  if(prev) h+=`<div class="ins ins-s"><span class="ic">✅</span><div><strong>Preventivo/Papanicolau:</strong> Jan +${prev.vjf}% fat com volume estável (+${prev.vjq}%). Ticket médio subiu — reajuste bem absorvido. Fev ${prev.vff>0?'+':''}${prev.vff}% fat mesmo com -${Math.abs(parseFloat(prev.vfq))}% volume (Carnaval).</div></div>`;
  const te=rows.find(r=>r.c==='TESTE ERGOMÉTRICO');
  if(te) h+=`<div class="ins ${parseFloat(te.vff)>100?'ins-s':'ins-i'}"><span class="ic">${parseFloat(te.vff)>100?'🚀':'💡'}</span><div><strong>Teste Ergométrico:</strong> Jan estável (+${te.vjf}%). <strong>Fev explodiu: +${te.vff}% fat</strong> (${fi(te.f5q)}→${fi(te.f6q)} exames). Verificar se houve ampliação de agenda ou demanda reprimida.</div></div>`;
  const eco=rows.find(r=>r.c==='ECOCARDIOGRAMA');
  if(eco&&parseFloat(eco.vjf)<0) h+=`<div class="ins ins-w"><span class="ic">⚠️</span><div><strong>Ecocardiograma:</strong> Leve queda Jan (${eco.vjf}%) e Fev (${eco.vff}%). Volume caindo enquanto Cardiologia cresce — possível gargalo de agenda de eco.</div></div>`;
  const holter=rows.find(r=>r.c==='HOLTER 24H');
  if(holter&&parseFloat(holter.vjq)<0) h+=`<div class="ins ins-w"><span class="ic">⚠️</span><div><strong>Holter:</strong> Queda de ${holter.vjq}% em volume Jan. Monitorar tendência.</div></div>`;
  const mapa=rows.find(r=>r.c==='MAPA 24H');
  if(mapa&&parseFloat(mapa.vfq)<-15) h+=`<div class="ins ins-w"><span class="ic">⚠️</span><div><strong>MAPA 24H:</strong> Queda em Fev (${mapa.vfq}% vol, ${mapa.vff}% fat). Verificar disponibilidade de equipamento/agenda.</div></div>`;
  return h;
}

// === ALERTAS & FORÇAS ===
function rAl(el){
  const drops=D.esp_movements.filter(e=>e.vj!=null&&e.vj<-15&&e.j5>5000).sort((a,b)=>a.vj-b.vj);

  el.innerHTML=`
    <div class="st">🚨 Especialidades em Queda — Exigem Ação</div>
    <div class="g g1"><div class="c"><div class="tw"><table>
      <tr><th>Especialidade</th><th>Fat Jan/25</th><th>Fat Jan/26</th><th>Δ Jan %</th><th>Perda Jan (R$)</th><th>Fat Fev/25</th><th>Fat Fev/26</th><th>Δ Fev %</th><th>Perda Fev (R$)</th><th>NPS</th></tr>
      ${drops.map(d=>`<tr style="background:rgba(244,63,94,.03)">
        <td><strong>${d.esp}</strong></td>
        <td class="m">R$ ${fm(d.j5)}</td><td class="m">R$ ${fm(d.j6)}</td><td>${ct(d.vj)}</td>
        <td class="m" style="color:var(--rd)">-R$ ${fm(d.perda_j)}</td>
        <td class="m">R$ ${fm(d.f5)}</td><td class="m">R$ ${fm(d.f6)}</td><td>${d.vf!=null?ct(d.vf):'—'}</td>
        <td class="m" style="color:var(--rd)">${d.perda_f>0?'-R$ '+fm(d.perda_f):'—'}</td>
        <td>${d.nps!=null?nt(d.nps)+' <span style="font-size:9px;color:var(--tx3)">n='+d.nps_n+'</span>':'—'}</td>
      </tr>`).join('')}
    </table></div></div></div>
    ${drops.map(d=>`<div class="ins ins-d"><span class="ic">🚨</span><div><strong>${d.esp}:</strong> Queda de ${d.vj.toFixed(0)}% em Jan (perda de R$ ${fm(d.perda_j)}/mês).${d.vf!=null?' Fev confirma: '+d.vf.toFixed(0)+'%.':''} ${Math.abs(d.vj)>50?'<strong>Provável perda de profissional — ação urgente de reposição.</strong>':'Monitorar nos próximos meses.'}${d.nps!=null?' NPS: +'+d.nps+'.':''}</div></div>`).join('')}

    <div class="st" style="margin-top:20px">✅ Especialidades em Crescimento — Pontos Fortes</div>
    <div class="g g1"><div class="c"><div class="tw"><table>
      <tr><th>Especialidade</th><th>Fat Jan/25</th><th>Fat Jan/26</th><th>Δ Jan %</th><th>Ganho Jan (R$)</th><th>Fat Fev/25</th><th>Fat Fev/26</th><th>Δ Fev %</th><th>NPS</th></tr>
      ${gains.map(d=>`<tr style="background:rgba(34,197,94,.03)">
        <td><strong>${d.esp}</strong></td>
        <td class="m">R$ ${fm(d.j5)}</td><td class="m">R$ ${fm(d.j6)}</td><td>${ct(d.vj)}</td>
        <td class="m" style="color:var(--gn)">+R$ ${fm(d.j6-d.j5)}</td>
        <td class="m">R$ ${fm(d.f5)}</td><td class="m">R$ ${fm(d.f6)}</td><td>${d.vf!=null?ct(d.vf):'—'}</td>
        <td>${d.nps!=null?nt(d.nps)+' <span style="font-size:9px;color:var(--tx3)">n='+d.nps_n+'</span>':'—'}</td>
      </tr>`).join('')}
    </table></div></div></div>
    ${gains.map(d=>`<div class="ins ins-s"><span class="ic">✅</span><div><strong>${d.esp}:</strong> +${d.vj.toFixed(0)}% em Jan (+R$ ${fm(d.j6-d.j5)}/mês).${d.vf!=null?' Fev: '+(d.vf>0?'+':'')+d.vf.toFixed(0)+'%.':''} ${d.vj>100?'Crescimento explosivo — provável novo profissional ou expansão de agenda.':'Tendência positiva, avaliar ampliação.'}${d.nps!=null?' NPS: +'+d.nps+'.':''}</div></div>`).join('')}

    <div class="st" style="margin-top:20px">→ Base Sólida — Estáveis e Fortes</div>
    <div class="g g1"><div class="c"><div class="tw"><table>
      <tr><th>Especialidade</th><th>Fat Jan/26</th><th>Δ Jan %</th><th>Fat Fev/26</th><th>Δ Fev %</th><th>NPS</th></tr>
      ${stable.map(d=>`<tr><td><strong>${d.esp}</strong></td><td class="m"><strong>R$ ${fm(d.j6)}</strong></td><td>${ct(d.vj)}</td><td class="m"><strong>R$ ${fm(d.f6)}</strong></td><td>${d.vf!=null?ct(d.vf):'—'}</td><td>${d.nps!=null?nt(d.nps):'—'}</td></tr>`).join('')}
    </table></div></div></div>
  `;
}

// === NPS & MÉDICOS ===
function rNp(el){
  const dnr=D.doc_neg_rank;
  const espN=Object.entries(D.nps_by_esp_all).filter(([_,v])=>v.total>=3).sort((a,b)=>a[1].nps_score-b[1].nps_score);
  el.innerHTML=`
    <div class="g g4">${CM.map(m=>{const d=D.nps_by_period[m];return`<div class="c"><h3>NPS ${m}</h3><div style="display:flex;align-items:center;gap:8px"><div class="nc ${ncl(d.nps_score)}">${d.nps_score>0?'+':''}${d.nps_score}</div><div style="font-size:10px"><span style="color:var(--gn)">P:${d.promotores}</span> <span style="color:var(--am)">N:${d.neutros}</span> <span style="color:var(--rd)">D:${d.detratores}</span><br><span style="color:var(--tx3)">x̄ ${d.media} · n=${d.total}</span></div></div></div>`}).join('')}</div>

    <div class="st">🚨 Ranking de Avaliações Negativas por Médico (ordem: mais detratores → menos)</div>
    <div class="g g1"><div class="c"><div class="sc"><table>
      <tr><th>Médico</th><th>Detratores</th><th>NPS</th><th>Média</th><th>Total Aval.</th><th>% Detr.</th><th>Especialidades</th><th>Avaliações Negativas</th></tr>
      ${dnr.map(d=>`<tr${d.nps_score<=50?' style="background:rgba(244,63,94,.04)"':''}>
        <td><strong>${d.nome}</strong></td>
        <td class="m" style="color:var(--rd);font-weight:700;font-size:14px">${d.det_abs}</td>
        <td>${nt(d.nps_score)}</td>
        <td class="m">${d.media}</td>
        <td class="m">${d.total}</td>
        <td><div style="display:flex;align-items:center;gap:4px"><div class="bb" style="width:40px"><div class="bf" style="width:${Math.min(d.pct_det*3,100)}%;background:${d.pct_det>15?'var(--rd)':d.pct_det>8?'var(--am)':'var(--gn)'}"></div></div><span class="m" style="font-size:10px">${d.pct_det}%</span></div></td>
        <td style="font-size:10px">${(d.especialidades||[]).join(', ')}</td>
        <td style="font-size:10px;max-width:280px">${d.det_comentarios.map(c=>`<span class="t ${c.score<=3?'t-r':'t-a'}">${c.score}</span> ${c.periodo}${c.comentario?' — '+c.comentario.substring(0,60)+(c.comentario.length>60?'...':''):''}`).join('<br>')}</td>
      </tr>`).join('')}
    </table></div></div></div>

    <div class="st">NPS por Especialidade (mín 3 avaliações)</div>
    <div class="g g1"><div class="c"><div class="tw"><table>
      <tr><th>Especialidade</th><th>NPS</th><th>Média</th><th>Prom.</th><th>Neut.</th><th>Detr.</th><th>n</th><th>% Detr.</th></tr>
      ${espN.map(([e,d])=>`<tr><td><strong>${e}</strong></td><td>${nt(d.nps_score)}</td><td class="m">${d.media}</td><td class="m" style="color:var(--gn)">${d.promotores}</td><td class="m" style="color:var(--am)">${d.neutros}</td><td class="m" style="color:var(--rd)">${d.detratores}</td><td class="m">${d.total}</td><td><div style="display:flex;align-items:center;gap:4px"><div class="bb" style="width:40px"><div class="bf" style="width:${Math.min(d.pct_det*3,100)}%;background:${d.pct_det>15?'var(--rd)':d.pct_det>8?'var(--am)':'var(--gn)'}"></div></div><span class="m" style="font-size:10px">${d.pct_det}%</span></div></td></tr>`).join('')}
    </table></div></div></div>
  `;
}

// === COMENTÁRIOS & AÇÕES ===
function rCm(el){
  const neg=D.all_comments.filter(c=>c.score<=6).sort((a,b)=>a.score-b.score);
  const neut=D.all_comments.filter(c=>c.score>=7&&c.score<=8).sort((a,b)=>a.score-b.score);
  const pos=D.all_comments.filter(c=>c.score>=9);

  // Categorize complaints
  const temas={};
  const keywords={
    'TEMPO DE ESPERA / DEMORA':['demora','espera','aguard','horas para','demorou','longo','tempo'],
    'ATENDIMENTO MÉDICO FRIO/RÁPIDO':['frio','menos de 10 minutos','apressad','pouca explicação','pouca explicao','não passa clareza','horrvel','frustan'],
    'RECEPÇÃO / ATENDIMENTO EQUIPE':['recepo','recepção','deboche','grosseiramente','desorganiz'],
    'ORGANIZAÇÃO / AGENDAMENTO':['agendamento','organizao','organização','planejamento','hora marcada','limitar'],
    'COMUNICAÇÃO / INFORMAÇÃO':['informativo','informações','whatsapp','informado'],
    'PRIVACIDADE / ESTRUTURA':['reservada','porta','sala','cadeiras','elevador'],
  };
  D.all_comments.filter(c=>c.score<=8).forEach(c=>{
    const txt=(c.comentario||'').toLowerCase();
    for(const[tema,kws] of Object.entries(keywords)){
      if(kws.some(k=>txt.includes(k))){
        if(!temas[tema])temas[tema]={count:0,examples:[]};
        temas[tema].count++;
        if(temas[tema].examples.length<3)temas[tema].examples.push(c);
      }
    }
  });
  const sortedTemas=Object.entries(temas).sort((a,b)=>b[1].count-a[1].count);

  el.innerHTML=`
    <div class="st">📋 Análise de Reclamações — Temas Mais Recorrentes</div>
    <p style="font-size:11px;color:var(--tx2);margin-bottom:12px">Baseado em ${D.all_comments.filter(c=>c.score<=8).length} comentários de detratores e neutros</p>
    ${sortedTemas.map(([tema,data])=>`
      <div class="ins ins-${data.count>=5?'d':data.count>=3?'w':'i'}">
        <span class="ic">${data.count>=5?'🚨':data.count>=3?'⚠️':'💡'}</span>
        <div>
          <strong>${tema}</strong> — ${data.count} menções<br>
          <div style="margin-top:4px;font-size:11px;color:var(--tx2)">${data.examples.map(e=>`"${e.comentario.substring(0,100)}${e.comentario.length>100?'...':''}" <span style="color:var(--tx3)">(score ${e.score}, ${e.medico.split(' ')[0]}, ${e.periodo})</span>`).join('<br>')}</div>
        </div>
      </div>
    `).join('')}

    <div class="st" style="margin-top:18px">🎯 Plano de Ação Sugerido</div>
    <div class="ins ins-d"><span class="ic">1️⃣</span><div><strong>Tempo de Espera (prioridade #1):</strong> Tema mais citado. Pacientes relatando 3-4h de espera. Ações: (a) Limitar agenda por hora marcada, (b) Monitorar tempo médio de espera por médico, (c) Comunicar proativamente atrasos via WhatsApp, (d) Avaliar se médicos com muitos pacientes precisam de agenda mais espaçada.</div></div>
    <div class="ins ins-d"><span class="ic">2️⃣</span><div><strong>Atendimento Médico (prioridade #2):</strong> Reclamações de consultas muito curtas, falta de explicação, frieza. Ações: (a) Feedback individual com os médicos citados (Aurélio/Ortopedia, Gileno/USG, Maspoli/USG), (b) Definir tempo mínimo de consulta, (c) Treinar comunicação empática especialmente em USG obstétrica/morfológica.</div></div>
    <div class="ins ins-w"><span class="ic">3️⃣</span><div><strong>Recepção e Atendimento da Equipe:</strong> Relatos de deboche e grosseria. Ações: (a) Treinamento de atendimento humanizado, (b) Cliente oculto periódico, (c) Bonificação por NPS da unidade.</div></div>
    <div class="ins ins-i"><span class="ic">4️⃣</span><div><strong>Privacidade na sala de Teste Ergométrico:</strong> Duas menções específicas sobre porta aberta expondo paciente. Ação simples e rápida: reorganizar fluxo da sala.</div></div>
    <div class="ins ins-i"><span class="ic">5️⃣</span><div><strong>Cadeiras do 2º andar (Ícone):</strong> Mencionado como desconfortável. Avaliar troca — impacta percepção durante espera longa.</div></div>

    <div class="st" style="margin-top:18px">💬 Todos os Comentários — Detratores (score ≤ 6)</div>
    ${neg.map(c=>`<div class="comment-box neg"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span><span class="t t-r">${c.score}</span> <strong>${c.medico}</strong></span><span class="m" style="color:var(--tx3)">${c.periodo} · ${c.unidade}</span></div><div>${c.procedimento}</div><div style="margin-top:4px">${c.comentario}</div></div>`).join('')}

    <div class="st" style="margin-top:14px">💬 Comentários — Neutros (score 7-8)</div>
    ${neut.map(c=>`<div class="comment-box neut"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span><span class="t t-a">${c.score}</span> <strong>${c.medico}</strong></span><span class="m" style="color:var(--tx3)">${c.periodo}</span></div><div style="font-size:11px">${c.comentario}</div></div>`).join('')}

    <div class="st" style="margin-top:14px">💬 Comentários — Promotores (score 9-10) com texto relevante</div>
    ${pos.filter(c=>c.comentario.length>15&&!/^(10|nota|ok|dez|tudo|gostei$)/i.test(c.comentario.trim())).slice(0,15).map(c=>`<div class="comment-box pos"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span><span class="t t-g">${c.score}</span> <strong>${c.medico}</strong></span><span class="m" style="color:var(--tx3)">${c.periodo}</span></div><div style="font-size:11px">${c.comentario}</div></div>`).join('')}
  `;
}

// === POR ESPECIALIDADE ===
function rSp(el){
  const ek=Object.keys(D.esp_data).sort();
  el.innerHTML=`<div class="fl"><select id="es">${ek.map(e=>`<option value="${e}">${e}</option>`).join('')}</select></div><div id="ec"></div>`;
  function re(esp){
    const d=D.esp_data[esp]||{};const mo=MO.map(m=>({m,q:d[m]?.qtd||0,f:d[m]?.fat||0}));
    const na=D.nps_by_esp_all[esp];
    const j5f=d['Jan/2025']?.fat||0,j6f=d['Jan/2026']?.fat||0;
    const vjf=j5f?pc(j6f,j5f):null;
    document.getElementById('ec').innerHTML=`
      <div class="g g4">
        <div class="c"><h3>Fat Jan/2026</h3><div class="v" style="font-size:20px">${fk(j6f)}</div><div class="ch ${vjf>0?'up':'down'}">${vjf!=null?(vjf>0?'+':'')+vjf+'% vs Jan/25':'—'}</div></div>
        <div class="c"><h3>Fat Fev/2026</h3><div class="v" style="font-size:20px">${fk(d['Fev/2026']?.fat||0)}</div></div>
        <div class="c"><h3>NPS</h3>${na?`<div style="display:flex;align-items:center;gap:8px"><div class="nc ${ncl(na.nps_score)}" style="width:44px;height:44px;font-size:15px">${na.nps_score>0?'+':''}${na.nps_score}</div><div style="font-size:10px;color:var(--tx2)">${na.total} aval · x̄${na.media}</div></div>`:'<span style="font-size:11px;color:var(--tx3)">Sem NPS</span>'}</div>
        <div class="c"><h3>Qtd Jan/2026</h3><div class="v" style="font-size:20px">${fi(d['Jan/2026']?.qtd||0)}</div></div>
      </div>
      <div class="g g2">
        <div class="c"><h3>Faturamento</h3><div class="cc"><canvas id="sF"></canvas></div></div>
        <div class="c"><h3>Volume</h3><div class="cc"><canvas id="sQ"></canvas></div></div>
      </div>`;
    dc();const lb=MO.map(m=>m.replace('/20',''));
    ch.sf=new Chart(document.getElementById('sF'),{type:'bar',data:{labels:lb,datasets:[{label:'Fat',data:mo.map(m=>m.f),backgroundColor:mo.map((_,i)=>i>=12?'rgba(79,143,247,.85)':'rgba(79,143,247,.28)'),borderRadius:4}]},options:{...CO,plugins:{legend:{display:false}},scales:{...CO.scales,y:{...CO.scales.y,ticks:{...CO.scales.y.ticks,callback:v=>fk(v)}}}}});
    ch.sq=new Chart(document.getElementById('sQ'),{type:'bar',data:{labels:lb,datasets:[{label:'Qtd',data:mo.map(m=>m.q),backgroundColor:mo.map((_,i)=>i>=12?'rgba(34,197,94,.8)':'rgba(34,197,94,.28)'),borderRadius:4}]},options:{...CO,plugins:{legend:{display:false}}}});
  }
  re(ek[0]);document.getElementById('es').addEventListener('change',e=>{dc();re(e.target.value)});
}

// === UNIDADES ===
function rUn(el){
  const units=Object.keys(D.unit_data).sort();
  el.innerHTML=`
    <div class="g g2">
      <div class="c"><h3>Jan/25 vs Jan/26</h3><div class="cc"><canvas id="u1"></canvas></div></div>
      <div class="c"><h3>Fev/25 vs Fev/26</h3><div class="cc"><canvas id="u2"></canvas></div></div>
    </div>
    <div class="g g1"><div class="c"><h3>Evolução Mensal por Unidade (R$)</h3><div class="tw sc"><table>
      <tr><th>Unidade</th>${MO.map(m=>`<th>${m.replace('/20','')}</th>`).join('')}</tr>
      ${units.map(u=>`<tr><td><strong>${u.replace('DR. SAÚDE','Dr.S.').replace('- ','')}</strong></td>${MO.map(m=>{const d=D.unit_data[u]?.[m];return`<td class="m"${m.includes('2026')?' style="background:rgba(79,143,247,.03)"':''}>${d?'R$ '+fm(d.fat):'—'}</td>`}).join('')}</tr>`).join('')}
    </table></div></div></div>`;
  const ul=units.map(u=>u.replace('DR. SAÚDE','').replace('- ','').replace('ÍCONE','Ícone').trim());
  function mc(id,p1,p2){ch[id]=new Chart(document.getElementById(id),{type:'bar',data:{labels:ul,datasets:[{label:p1,data:units.map(u=>D.unit_data[u]?.[p1]?.fat||0),backgroundColor:'rgba(124,92,252,.4)',borderRadius:4},{label:p2,data:units.map(u=>D.unit_data[u]?.[p2]?.fat||0),backgroundColor:'rgba(79,143,247,.8)',borderRadius:4}]},options:{...CO,indexAxis:'y',scales:{x:{ticks:{color:'#4e5d78',callback:v=>fk(v)},grid:{color:'rgba(28,40,68,.4)'}},y:{ticks:{color:'#7b8ba5',font:{size:10}},grid:{display:false}}}}})}
  mc('u1','Jan/2025','Jan/2026');mc('u2','Fev/2025','Fev/2026');
}

render('overview');
</script>
